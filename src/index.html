<!doctype html>
<html
  lang="en"
  class="is-snapping"
  data-fa-kit-code="d7ec6ed89a"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Brian Talbot</title>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="ee99e4a9-ab5f-4622-bf83-9db465f35655"
      data-domains="www.talbs.me"
      data-do-not-track="true"
      data-exclude-search="true"
    ></script>
    <meta
      name="description"
      content="Brian Talbot’s live status: what he’s up to right now in Boston, under the real sky."
    />
    <link
      rel="canonical"
      href="https://www.talbs.me/"
    />
    <link
      rel="icon"
      href="favicon.svg"
      type="image/svg+xml"
      id="favicon"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://www.talbs.me/"
    />
    <meta
      property="og:title"
      content="Brian Talbot"
    />
    <meta
      property="og:description"
      content="Brian Talbot’s live status: what he’s up to right now in Boston, under the real sky."
    />
    <meta
      property="og:image"
      content="https://www.talbs.me/og.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="Brian Talbot’s status card on a starry night sky: “What I’m up to, right now…” with Boston time and weather, the real sky, and what’s playing."
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <!-- build:font -->
    <!-- build:css -->
  </head>
  <body>
    <div
      class="sky"
      aria-hidden="true"
    ></div>
    <header class="intro">
      <hgroup class="wa-stack wa-gap-2xs">
        <h1>Brian Talbot</h1>
        <p
          class="bio wa-font-weight-light"
          id="bio"
        >
          Pusher of
          <a
            class="wa-text-nowrap"
            href="https://github.com/talbs/cookbook/blob/main/recipes/desserts/chocolate-chip-cookies.md"
            >warm cookies</a
          >
          and cool pixels (at&nbsp;<a
            class="wa-text-nowrap"
            href="https://fontawesome.com/"
            >Font Awesome</a
          >
          and
          <a
            class="wa-text-nowrap"
            href="https://webawesome.com/"
            >Web Awesome</a
          >).
        </p>
      </hgroup>
    </header>
    <div
      class="starfield"
      aria-hidden="true"
    >
      <div class="stars"></div>
    </div>
    <main>
      <div class="stage">
        <article class="card wa-border-radius-m">
          <details
            class="tray"
            id="tray"
          >
            <summary class="wa-cluster wa-flex-nowrap wa-gap-s">
              <tiny-tell
                id="tell"
                skin="eyes"
                state="working"
                scheme="dark"
                color="state"
                label=""
              ></tiny-tell>
              <span
                class="line wa-text-balance"
                id="line"
                >Somewhere between a pull request and a pot of something.</span
              ><span class="wa-visually-hidden">, links</span>
              <svg
                class="chev"
                viewBox="0 0 12 12"
                aria-hidden="true"
              >
                <path
                  d="M2 4.5 6 8.5 10 4.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
              </svg>
            </summary>
            <nav aria-label="Links">
              <div
                class="scroll"
                id="scroller"
              >
                <div
                  class="highlight"
                  id="highlight"
                  aria-hidden="true"
                  hidden
                ></div>
                <!-- build:links -->
              </div>
            </nav>
          </details>
          <ul
            class="meta wa-list-plain"
            id="meta"
            hidden
          >
            <li
              class="cell wa-text-nowrap"
              id="time"
            ></li>
            <li
              class="cell cell-cut wa-text-nowrap"
              id="context"
            ></li>
            <li
              class="cell cell-cut wa-text-nowrap"
              id="music"
              hidden
            ></li>
          </ul>
        </article>
      </div>
    </main>
    <div
      class="day"
      id="day"
      hidden
    >
      <wa-slider
        id="scrubber"
        class="wa-visually-hidden-label wa-visually-hidden-hint"
        label="Brian’s day"
        hint="Drag through the day. It springs back to now."
        min="0"
        max="1430"
        step="10"
      ></wa-slider>
      <span
        class="thumb-anchor"
        id="thumb-anchor"
      ></span>
      <wa-tooltip
        for="thumb-anchor"
        trigger="manual"
      >
        <wa-random-content animation="none">
          <span>Be kind, rewind.</span>
          <span>88 mph not required.</span>
          <span>Wibbly-wobbly, timey-wimey.</span>
          <span>Step on no butterflies.</span>
        </wa-random-content>
      </wa-tooltip>
    </div>
    <!-- build:js -->
  </body>
</html>
